services:
  # Service web principal (frontend)
  - type: web
    name: lab-math-frontend
    env: static
    buildCommand: ""
    startCommand: ""
    outputDir: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    
    # Variables d'environnement
    envVars:
      - key: NODE_ENV
        value: production
    
    # Plan et région
    plan: free
    region: frankfurt

  # API backend (optionnel)
  - type: web
    name: lab-math-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn contact:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labmath-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
    
    # Base de données
    databases:
      - name: labmath-db
        databaseName: labmath
        plan: free
    
    plan: free
    region: frankfurt

# Cron jobs (optionnel)
jobs:
  - type: cron
    name: cleanup-old-contacts
    schedule: "0 0 * * *"
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python cleanup.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labmath-db
          property: connectionString